name: Executável de apresentação (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    paths:
      - "apresentacao/**"
      - "apps/**"
      - "cursos/**"
      - "templates/**"
      - "static/**"
      - "requirements.txt"
      - ".github/workflows/executavel.yml"

# Para publicar o instalador na página de Releases.
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Pango/GTK para o WeasyPrint gerar os PDFs (certificado e recibo).
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-pango

      - name: Separar as bibliotecas do PDF
        shell: pwsh
        run: |
          $mingw = Join-Path "${{ steps.msys2.outputs.msys2-location }}" "mingw64"
          $gtk = Join-Path $env:RUNNER_TEMP "gtk"
          New-Item -ItemType Directory -Force "$gtk/bin", "$gtk/etc" | Out-Null
          Copy-Item "$mingw/bin/*.dll" "$gtk/bin/"
          Copy-Item -Recurse "$mingw/etc/fonts" "$gtk/etc/fonts"
          "GTK_DIR=$gtk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-ChildItem "$gtk/bin" | Measure-Object -Property Length -Sum |
            ForEach-Object { "{0} DLLs, {1:N0} MB" -f $_.Count, ($_.Sum / 1MB) }

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Empacotar
        run: pyinstaller --noconfirm --log-level WARN apresentacao/cursos_livres.spec

      # Roda o próprio executável: sobe o sistema, abre as telas e gera um certificado.
      # Falha também se aparecer erro de fontes (a mensagem apareceria na apresentação).
      - name: Testar o executável
        shell: cmd
        env:
          PYTHONIOENCODING: utf-8
        run: |
          "dist\CursosLivres-Apresentacao\Iniciar apresentacao.exe" --teste --porta 8123 > teste.txt 2>&1
          set CODIGO=%ERRORLEVEL%
          type teste.txt
          if not "%CODIGO%"=="0" exit /b %CODIGO%
          findstr /C:"Fontconfig error" teste.txt && (echo ERRO: as fontes do PDF nao foram configuradas & exit /b 1)
          exit /b 0

      - uses: actions/upload-artifact@v4
        with:
          name: certificado-gerado-no-teste
          path: dist/CursosLivres-Apresentacao/dados-da-apresentacao/certificado-teste.pdf
          retention-days: 7

      - name: Tirar os dados do teste do pacote
        shell: pwsh
        run: Remove-Item -Recurse -Force "dist/CursosLivres-Apresentacao/dados-da-apresentacao"

      - name: Incluir as instruções
        shell: pwsh
        run: Copy-Item apresentacao/LEIA-ME.txt dist/CursosLivres-Apresentacao/

      # Instalador .exe (Inno Setup): instala para o usuário, sem pedir administrador.
      - name: Montar o instalador
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
          }
          $versao = "1.0.${{ github.run_number }}"
          & $iscc /Q "/DPasta=$PWD\dist\CursosLivres-Apresentacao" "/DVersao=$versao" apresentacao\instalador.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item dist\CursosLivres-Apresentacao-Instalador.exe | ForEach-Object { "{0}: {1:N0} MB" -f $_.Name, ($_.Length / 1MB) }

      # Instala em silêncio numa pasta temporária e roda o autoteste no programa instalado.
      - name: Testar o instalador
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          $destino = Join-Path $env:RUNNER_TEMP "instalado"
          Start-Process dist\CursosLivres-Apresentacao-Instalador.exe -Wait -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/MERGETASKS=!atalho", "/DIR=$destino"
          )
          $exe = Join-Path $destino "Iniciar apresentacao.exe"
          if (-not (Test-Path $exe)) { throw "O instalador não colocou o executável em $destino" }
          & $exe --teste --porta 8124 *> instalado.txt
          $codigo = $LASTEXITCODE
          Get-Content instalado.txt
          if ($codigo -ne 0) { exit $codigo }
          if (Select-String -Path instalado.txt -SimpleMatch "Fontconfig error") { throw "Erro de fontes no programa instalado" }

      - name: Montar o .zip portátil
        shell: pwsh
        run: Compress-Archive -Path dist\CursosLivres-Apresentacao -DestinationPath dist\CursosLivres-Apresentacao-Portatil.zip

      - uses: actions/upload-artifact@v4
        with:
          name: CursosLivres-Apresentacao-Windows
          path: |
            dist/CursosLivres-Apresentacao-Instalador.exe
            dist/CursosLivres-Apresentacao-Portatil.zip
          retention-days: 30

      # Na main, publica em Releases (aparece no app do GitHub e tem link fixo de download).
      # Fica só a versão mais recente.
      - name: Publicar em Releases
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "apresentacao-${{ github.run_number }}"
          $data = (Get-Date).ToUniversalTime().AddHours(-3).ToString("dd/MM/yyyy")
          $notas = @"
          Executável para apresentação do sistema no Windows (não precisa de Python nem de internet).

          **Instalador (recomendado):** baixe ``CursosLivres-Apresentacao-Instalador.exe``, abra e siga os passos. Cria um atalho na Área de Trabalho.
          **Portátil:** baixe ``CursosLivres-Apresentacao-Portatil.zip``, extraia e abra ``Iniciar apresentacao.exe`` dentro da pasta.

          Usuários (senha ``demo1234``): ``admin``, ``maria``, ``carlos``, ``aluno``.

          Se o Windows mostrar "O Windows protegeu o computador", clique em "Mais informações" e em "Executar assim mesmo" (o programa não tem assinatura digital).

          Versão do código: ${{ github.sha }}
          "@
          gh release create $tag `
            dist/CursosLivres-Apresentacao-Instalador.exe `
            dist/CursosLivres-Apresentacao-Portatil.zip `
            --target "${{ github.sha }}" --title "Apresentação de $data" --notes $notas --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release list --limit 100 --json tagName --jq ".[].tagName" |
            Where-Object { $_ -like "apresentacao-*" -and $_ -ne $tag } |
            ForEach-Object { gh release delete $_ --cleanup-tag --yes }
