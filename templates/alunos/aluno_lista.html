{% extends "base.html" %}
{% block title %}Alunos · Cursos Livres{% endblock %}
{% block content %}
{% url 'alunos:aluno_novo' as novo_url %}
{% include "partials/cabecalho_lista.html" with titulo="Alunos" novo_rotulo="Novo aluno" %}

<form method="get" class="mb-4">
  <input type="search" name="q" value="{{ request.GET.q }}" placeholder="Buscar por nome ou CPF"
         class="w-full rounded border border-slate-300 px-3 py-2"
         hx-get="{% url 'alunos:aluno_lista' %}" hx-trigger="input changed delay:300ms, search"
         hx-target="#resultados" hx-push-url="true">
</form>

<div id="resultados">{% include "alunos/_aluno_resultados.html" %}</div>
{% endblock %}
