{% extends "base.html" %}
{% block title %}{{ titulo }} · Cursos Livres{% endblock %}
{% block content %}
<div class="mx-auto max-w-3xl">
  <a href="{{ voltar_url }}" class="text-sm text-indigo-700 hover:underline">← Voltar</a>
  <h1 class="mt-2 mb-4 text-2xl font-semibold">{{ titulo }}</h1>
  <form method="post" class="rounded-lg bg-white p-4 shadow sm:p-6" novalidate>
    {% csrf_token %}
    {% include "partials/formulario.html" %}
    {% block depois_dos_campos %}{% endblock %}
    <div class="mt-6 flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
      <a href="{{ voltar_url }}" class="rounded px-4 py-2 text-center ring-1 ring-slate-300 hover:bg-slate-50">Cancelar</a>
      <button class="rounded bg-indigo-700 px-4 py-2 font-medium text-white hover:bg-indigo-800">Salvar</button>
    </div>
  </form>
</div>
{% endblock %}
