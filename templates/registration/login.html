{% extends "base.html" %}
{% block title %}Entrar · Cursos Livres{% endblock %}
{% block content %}
<div class="mx-auto mt-10 max-w-sm rounded-lg bg-white p-6 shadow">
  <h1 class="mb-4 text-xl font-semibold">Entrar</h1>
  {% if form.errors %}
    <p class="mb-3 rounded bg-red-50 px-3 py-2 text-sm text-red-700">Usuário ou senha inválidos.</p>
  {% endif %}
  <form method="post" class="space-y-4">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <label class="block">
      <span class="text-sm">Usuário</span>
      <input name="username" autocomplete="username" required autofocus
             class="mt-1 w-full rounded border border-slate-300 px-3 py-2">
    </label>
    <label class="block">
      <span class="text-sm">Senha</span>
      <input type="password" name="password" autocomplete="current-password" required
             class="mt-1 w-full rounded border border-slate-300 px-3 py-2">
    </label>
    <button class="w-full rounded bg-indigo-700 py-2 font-medium text-white hover:bg-indigo-800">Entrar</button>
  </form>
  <p class="mt-4 text-center text-sm">
    <a class="text-indigo-700 hover:underline" href="{% url 'contas:password_reset' %}">Esqueci minha senha</a>
  </p>
</div>
{% endblock %}
