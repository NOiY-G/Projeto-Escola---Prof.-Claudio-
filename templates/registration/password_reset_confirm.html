{% extends "base.html" %}
{% block content %}
<div class="mx-auto mt-10 max-w-sm rounded-lg bg-white p-6 shadow">
  <h1 class="mb-4 text-xl font-semibold">Nova senha</h1>
  {% if validlink %}
    <form method="post" class="space-y-4">
      {% csrf_token %}
      {% for field in form %}
        <label class="block">
          <span class="text-sm">{{ field.label }}</span>
          <input type="password" name="{{ field.html_name }}" required
                 class="mt-1 w-full rounded border border-slate-300 px-3 py-2">
          {% for erro in field.errors %}<span class="text-sm text-red-700">{{ erro }}</span>{% endfor %}
        </label>
      {% endfor %}
      <button class="w-full rounded bg-indigo-700 py-2 font-medium text-white hover:bg-indigo-800">Salvar senha</button>
    </form>
  {% else %}
    <p class="text-sm text-slate-600">Este link é inválido ou já foi usado. Solicite um novo.</p>
    <p class="mt-4 text-sm"><a class="text-indigo-700 hover:underline" href="{% url 'contas:password_reset' %}">Recuperar senha</a></p>
  {% endif %}
</div>
{% endblock %}
