{% extends "base.html" %}
{% block title %}Recuperar senha · Cursos Livres{% endblock %}
{% block content %}
<div class="mx-auto mt-10 max-w-sm rounded-lg bg-white p-6 shadow">
  <h1 class="mb-2 text-xl font-semibold">Recuperar senha</h1>
  <p class="mb-4 text-sm text-slate-600">Informe seu e-mail e enviaremos um link para criar uma nova senha.</p>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    <label class="block">
      <span class="text-sm">E-mail</span>
      <input type="email" name="email" required autofocus
             class="mt-1 w-full rounded border border-slate-300 px-3 py-2">
    </label>
    <button class="w-full rounded bg-indigo-700 py-2 font-medium text-white hover:bg-indigo-800">Enviar link</button>
  </form>
  <p class="mt-4 text-center text-sm"><a class="text-indigo-700 hover:underline" href="{% url 'contas:login' %}">Voltar ao login</a></p>
</div>
{% endblock %}
