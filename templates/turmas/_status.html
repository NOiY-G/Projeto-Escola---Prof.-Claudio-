<span class="rounded-full px-2 py-0.5 text-xs font-medium
  {% if turma.status == 'inscricoes_abertas' %}bg-green-100 text-green-800
  {% elif turma.status == 'em_andamento' %}bg-blue-100 text-blue-800
  {% elif turma.status == 'concluida' %}bg-slate-200 text-slate-700
  {% elif turma.status == 'cancelada' %}bg-red-100 text-red-700
  {% else %}bg-amber-100 text-amber-800{% endif %}">{{ turma.get_status_display }}</span>
